name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Test
        run: uv run --frozen pytest --junitxml="$RUNNER_TEMP/pytest-results.xml"

      - name: Report test failures
        if: failure()
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "pytest-results.xml"
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      failure = case.find(tag)
                      if failure is None:
                          continue
                      message = f"{case.get('classname')}.{case.get('name')}\n{failure.text}"
                      message = message[:12000].replace("%", "%25")
                      message = message.replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=pytest failure::{message}")
