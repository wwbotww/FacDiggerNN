research_id: m6_eodhd_engineering_full_date_v2
base_dataset_config: configs/datasets/eodhd_historical_liquid.yaml
output_root: artifacts/research
snapshot_output_root: data/walk_forward_snapshots
seeds: [17, 42, 73]

folds:
  - fold_id: wf1
    train_end: 2020-12-31
    valid_end: 2021-12-31
    test_end: 2022-12-30
    embargo_sessions: 5
  - fold_id: wf2
    train_end: 2021-12-31
    valid_end: 2022-12-30
    test_end: 2023-12-29
    embargo_sessions: 5
  - fold_id: wf3
    train_end: 2022-12-30
    valid_end: 2024-12-31
    test_end: 2025-12-31
    embargo_sessions: 5

models:
  e0: configs/experiments/e0_lightgbm_paid_pilot.yaml
  e1: configs/experiments/e1_random.yaml
  e2: configs/experiments/e2_etth1.yaml
  e3: configs/experiments/e3_financial_pretrain.yaml

hac_lags: 5
non_overlapping_stride: 5
non_overlapping_offset: 0

decisions:
  minimum_positive_cell_ratio: 0.6666666667
  minimum_mean_rank_ic_delta: 0.0
  significance_alpha: 0.05
  multiple_comparison_method: holm
  minimum_daily_observations_per_fold: 120
  minimum_non_overlapping_observations_per_fold: 24
  require_non_overlapping_positive: true
  require_validation_go_before_holdout: true
  cost_bps: 20
  # EOD-only engineering mode has no point-in-time industry/market-cap exposure.
  # Formal research configs must turn both gates back on.
  require_neutralized_positive: false
  require_source_research_ready: false
